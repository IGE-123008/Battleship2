name: Build and Publish Battleship to Docker Hub

# O pipeline corre automaticamente sempre que houver um push para o ramo 'main'
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarrega o código do repositório para o servidor do GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configura o Java (JDK 17 - podes alterar para a versão que usam no Iscte)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compila e gera o ficheiro JAR do projeto (Equivalente ao ponto E2)
      - name: Build project with Maven
        run: mvn clean package

      # 4. Faz login automático na tua conta do Docker Hub usando os Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Configura o motor de Build do Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Constrói a imagem a partir do teu Dockerfile e envia-a para o teu Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Isto vai criar a imagem no formato: teu_utilizador/battleship-game:latest
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/battleship-game:latest